site_name: 社会調査設計法
site_description: 立教大学「社会調査設計法」2022年度 授業資料（過去の担当授業）
site_author: 小野原 彩香
site_url: https://aonoa68.github.io/chosa-sekkei/
repo_url: https://github.com/aonoa68/chosa-sekkei
repo_name: aonoa68/chosa-sekkei

theme:
  name: material
  language: ja
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: ライトモードに切り替え
  features:
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:
        - ja

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - ホーム: index.md
  - 各回の資料:
      - "第1回 社会調査の企画・設計": week01.md
      - "第2回 全数調査と標本調査": week02.md
      - "第3回 調査の実施方法": week03.md
      - "第4回 台帳とサンプリング": week04.md
      - "第5回 標本抽出の技法": week05.md
      - "第6回 調査票作成1": week06.md
      - "第7回 調査票作成2": week07.md
      - "第8回 実査の論点": week08.md
      - "第9回 調査データの整理": week09.md
      - "第10回 コーディング": week10.md
      - "第11回 量的調査の集計分析1：母数の推定": week11.md
      - "第12回 量的調査の集計分析2：2変量の関連": week12.md
      - "第13回 検査と実験": week13.md
      - "第14回 調査と科学の倫理": week14.md
  - 担当授業の一覧（Teaching）: https://aonoa68.github.io/teaching/

copyright: © 小野原 彩香 — 立教大学「社会調査設計法」（2022年度）
